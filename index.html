<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scratch & Share Image</title>

  <script src="https://cdn.counter.dev/script.js" data-id="e8740076-f89b-4b42-ad0d-a516a0e135db" data-utcoffset="8"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5GXKV1VQ59"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5GXKV1VQ59');
  </script>

  <link rel="stylesheet" href="style.css">

  <style>
    .statcounter-container {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.6);
      padding: 5px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>🎉 Scratch the Image 🎉</h1>
  <p>Upload an image to generate a shareable scratch link.</p>

  <div class="container">
    <input type="file" id="upload" accept="image/*">

    <!-- Expiration dropdown -->
    <div class="expiration-container">
      <label for="expiration">Expiration (optional):</label>
      <select id="expiration">
      <option value="60">1 minute</option> <!-- new option -->
      <option value="300" selected>5 minutes</option> <!-- default selected -->
      <option value="1800">30 minutes</option>
      <option value="3600">1 hour</option>
      <option value="21600">6 hours</option>
      <option value="43200">12 hours</option>
      <option value="86400">24 hours</option>
      <option value="">No expiration</option>
      </select>

      <p class="muted">
        Enable this if you want to force uploads to be auto deleted after a certain time (default is 5 minutes)
      </p>
    </div>

    <!-- Loading spinner -->
    <div id="loading" role="status" aria-live="polite" style="display:none;">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Uploading image...</p>
    </div>

    <!-- Share link dialog (shown after upload) -->
    <div id="linkDialog" class="card" style="display:none;">
      <p class="muted">Shareable link generated</p>
      <input type="text" id="generatedLink" readonly>
      <p id="expirationInfo" class="muted"></p>
      <div class="row">
        <button id="copyLinkBtn">📋 Copy Share Link</button>
        <button id="viewLinkBtn">🔗 View Link</button>
      </div>
    </div>

    <!-- Scratch container (only visible when visiting ?img= ) -->
    <div id="scratchWrapper" class="image-box" style="display:none;">
      <img id="hiddenImage" src="" alt="hidden image">
      <canvas id="scratchCanvas"></canvas>
    </div>
  </div>

  <script src="script.js"></script>

  <div class="statcounter-container">
    <script type="text/javascript">
      var sc_project=13169601; 
      var sc_invisible=0; 
      var sc_security="032173bb"; 
      var scJsHost = "https://";
      document.write("<sc"+"ript type='text/javascript' src='" + scJsHost+
      "statcounter.com/counter/counter.js'></"+"script>");
    </script>
    <noscript>
      <div class="statcounter">
        <a title="Web Analytics" href="https://statcounter.com/" target="_blank">
          <img class="statcounter"
            src="https://c.statcounter.com/13169601/0/032173bb/0/"
            alt="Web Analytics"
            referrerPolicy="no-referrer-when-downgrade">
        </a>
      </div>
    </noscript>
  </div>
</body>
</html>
